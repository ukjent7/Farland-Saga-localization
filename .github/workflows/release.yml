name: release

# 编译分发给终端用户的补丁器可执行文件，并在打 tag 或手动确认时创建
# GitHub Release。补丁载荷（含游戏数据）由私有工作区生成后上传到同一个
# Release，本工作流只构建公开仓库里的补丁器源码。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: '创建 GitHub Release 并上传构建产物'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: 构建补丁器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: patcher/go.mod
          cache: false
      - name: 静态检查与单元测试
        run: |
          cd patcher
          go vet ./...
          go test ./...
      - name: 构建 Windows 可执行文件
        run: |
          cd patcher
          # -H windowsgui：GUI 子系统，双击运行不会弹出控制台窗口；
          # 从终端调用子命令时标准输出仍然可用。
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w -H windowsgui' \
            -o ../FarlandSagaPatcher-windows-amd64.exe .
      - name: 记录校验和
        run: |
          sha256sum FarlandSagaPatcher-windows-amd64.exe > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: patcher-binaries
          if-no-files-found: error
          path: |
            FarlandSagaPatcher-windows-amd64.exe
            SHA256SUMS

  publish:
    name: 发布 Release
    needs: build
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.publish)
      || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      # gh release create 要在本地 git 仓库里解析 tag 指向的提交，只下载产物
      # 不够；fetch-depth: 0 才会把 tag 引用取下来。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: patcher-binaries
          path: binaries
      - name: 生成 Release 说明
        run: |
          {
            echo "## FARLAND SAGA I Saturn Tribute Trilingual Patcher ${GITHUB_REF_NAME}"
            echo
            echo "> [!WARNING]"
            echo "> **Alpha Preview Stage**: This release is an early preview build for testing purposes only."
            echo
            echo "A lightweight, standalone single-executable patcher embedding English, Simplified Chinese (简体中文), and Korean (한국어) localizations."
            echo
            echo "### Quick Start"
            echo "1. Download \`FarlandSagaPatcher-windows-amd64.exe\` below."
            echo "2. Place it into your Steam game directory (alongside \`FarlandSaga.exe\`)."
            echo "3. Run the executable, choose your language, and click **Install**."
            echo "4. Click **Restore** anytime to return completely to the pristine original game."
            echo
            echo "> [!NOTE]"
            echo "> Please exit the game before installing or restoring."
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat binaries/SHA256SUMS
            echo '```'
          } > release-notes.md
      - name: 创建或更新 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" binaries/* --clobber
          else
            gh release create "$tag" \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "FARLAND SAGA I Saturn Tribute Patcher ${tag}" \
              --notes-file release-notes.md \
              binaries/*
          fi

name: release

# 编译分发给终端用户的补丁器可执行文件，并在打 tag 或手动确认时创建
# GitHub Release。补丁载荷（含游戏数据）由私有工作区生成后上传到同一个
# Release，本工作流只构建公开仓库里的补丁器源码。
on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: '创建 GitHub Release 并上传构建产物'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: 构建补丁器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: patcher/go.mod
      - name: 静态检查与单元测试
        run: |
          cd patcher
          go vet ./...
          go test ./...
      - name: 构建 Windows 可执行文件
        run: |
          cd patcher
          # -H windowsgui：GUI 子系统，双击运行不会弹出控制台窗口；
          # 从终端调用子命令时标准输出仍然可用。
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w -H windowsgui' \
            -o ../FarlandSagaPatcher-windows-amd64.exe .
      - name: 构建 Linux 可执行文件
        run: |
          cd patcher
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' \
            -o ../farland-saga-patcher-linux-amd64 .
      - name: 记录校验和
        run: |
          sha256sum FarlandSagaPatcher-windows-amd64.exe \
                    farland-saga-patcher-linux-amd64 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: patcher-binaries
          if-no-files-found: error
          path: |
            FarlandSagaPatcher-windows-amd64.exe
            farland-saga-patcher-linux-amd64
            SHA256SUMS

  publish:
    name: 发布 Release
    needs: build
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.publish)
      || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: patcher-binaries
          path: binaries
      - name: 生成 Release 说明
        run: |
          {
            echo "## FARLAND SAGA I Saturn Tribute 三语本地化补丁器 ${GITHUB_REF_NAME}"
            echo
            echo "### 文件"
            echo
            echo '| 文件 | 说明 |'
            echo '| --- | --- |'
            echo '| `FarlandSagaPatcher-windows-amd64.exe` | Windows 补丁器，带图形界面；此版本不含补丁数据 |'
            echo '| `farland-saga-patcher-linux-amd64` | Linux 补丁器，命令行与交互向导，供维护者在 WSL 中自测 |'
            echo '| `SHA256SUMS` | 上述两个文件的 SHA-256 校验和 |'
            echo
            echo "### 使用方法"
            echo
            echo '面向玩家的单文件版本由维护者在私有工作区用'
            echo '`localize.py build-patcher` 生成后上传到本 Release：补丁经 `go:embed`'
            echo '内嵌，一个 exe 自带简体中文、韩文、英文三个补丁。把它放进游戏根目录'
            echo '（与 `FarlandSaga.exe` 同级）双击运行，第一屏选语言，第二屏只有'
            echo '「安装」和「还原」两个按钮。点安装并确认后等待写入与校验完成，'
            echo '换语言先点返回回到第一屏再选。'
            echo
            echo '本 Release 里的 `FarlandSagaPatcher-windows-amd64.exe` 由 CI 直接编译，'
            echo '不带补丁，供检查与二次打包使用；它的语言按钮会显示「（未提供）」，'
            echo '命令行子命令仍可用 `--payload` 指定外部补丁包。'
            echo
            echo '```bash'
            echo 'FarlandSagaPatcher.exe                  # 图形界面：先选语言，再安装或还原'
            echo 'FarlandSagaPatcher.exe wizard           # 控制台向导：安装或恢复'
            echo 'FarlandSagaPatcher.exe install --yes    # 非交互安装'
            echo 'FarlandSagaPatcher.exe restore --yes    # 恢复原版'
            echo 'FarlandSagaPatcher.exe status           # 查看当前状态'
            echo '```'
            echo
            echo '安装前请先退出游戏。补丁只修改载荷清单中列出的文件，原版备份在游戏目录的'
            echo '`FarlandSagaPatcher-backup` 目录中（整个生命周期只有一个，不随安装次数增加），'
            echo '删除备份前请确认不再需要恢复。'
            echo
            echo "### 校验和"
            echo
            echo '```'
            cat binaries/SHA256SUMS
            echo '```'
          } > release-notes.md
      - name: 创建或更新 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" binaries/* --clobber
          else
            gh release create "$tag" \
              --title "FARLAND SAGA I Saturn Tribute 补丁器 ${tag}" \
              --notes-file release-notes.md \
              binaries/*
          fi

name: release

# 编译分发给终端用户的补丁器可执行文件，并在打 tag 或手动确认时创建
# GitHub Release。二代在构建时把公开仓库里的 recipe 编译成 plan.bin 并
# 内嵌；一代仍内嵌仓库中的 ZIP 载荷。两条流水线都不需要游戏文件。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: '创建 GitHub Release 并上传构建产物'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: 构建补丁器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: patcher/go.mod
          cache: false
      - name: 编译二代 recipe plan
        env:
          FARLAND_WORK: ${{ runner.temp }}/work
          UV_PYTHON_DOWNLOADS: automatic
          UV_PYTHON_PREFERENCE: managed
        run: |
          echo "=== 正在从公开 recipe 与 OFL 字体编译二代安装计划 ==="
          bash uv.sh run --locked python tools/compile_recipe.py
      - name: 静态检查与单元测试
        run: |
          cd patcher
          echo "=== 正在校验一代补丁器（默认构建）==="
          go vet ./...
          go test ./...
          echo "=== 正在校验二代补丁器（-tags saga2）==="
          go vet -tags saga2 ./...
          go test -tags saga2 ./...
      # 发布前把不需要游戏文件的门禁再跑一遍：plan 与 recipe 一致、公开目录
      # 没有遗留文件、编译器拒绝坏配方。全量 E2E 需要真实镜像，在本地跑。
      - name: recipe 门禁（无需游戏文件）
        env:
          FARLAND_WORK: ${{ runner.temp }}/work
          UV_PYTHON_DOWNLOADS: automatic
          UV_PYTHON_PREFERENCE: managed
        run: |
          echo "=== 正在校验 plan 与 recipe 的一致性、目录卫生与编译器反例 ==="
          bash uv.sh run --locked python tools/recipe_checks.py --jobs 4
      - name: 构建 Windows 可执行文件
        run: |
          # 两代共用一个模块，只有 game_saga*.go / payload_saga*.go 等少数
          # 文件按构建标签二选一。-H windowsgui：GUI 子系统，双击运行不会
          # 弹出控制台窗口；从终端调用子命令时标准输出仍然可用。
          cd patcher
          echo "=== 正在编译一代补丁器 ==="
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w -H windowsgui' \
            -o ../FarlandSagaPatcher-windows-amd64.exe .
          echo "=== 正在编译二代补丁器 ==="
          GOOS=windows GOARCH=amd64 go build -tags saga2 -trimpath -ldflags='-s -w -H windowsgui' \
            -o ../FarlandSaga2Patcher-windows-amd64.exe .
      - name: 记录校验和
        run: |
          sha256sum FarlandSagaPatcher-windows-amd64.exe FarlandSaga2Patcher-windows-amd64.exe > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: patcher-binaries
          if-no-files-found: error
          path: |
            FarlandSagaPatcher-windows-amd64.exe
            FarlandSaga2Patcher-windows-amd64.exe
            SHA256SUMS

  publish:
    name: 发布 Release
    needs: build
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.publish)
      || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      # gh release create 要在本地 git 仓库里解析 tag 指向的提交，只下载产物
      # 不够；fetch-depth: 0 才会把 tag 引用取下来。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: patcher-binaries
          path: binaries
      - name: 生成 Release 说明
        run: |
          {
            echo "## FARLAND SAGA I & II Saturn Tribute Trilingual Patcher ${GITHUB_REF_NAME}"
            echo
            echo "> [!WARNING]"
            echo "> **Alpha Preview Stage**: This release is an early preview build for testing purposes only."
            echo
            echo "Standalone single-executable patchers embedding English, Simplified Chinese (简体中文), and Korean (한국어) localizations for both Farland Saga I & II."
            echo
            echo "### Quick Start"
            echo "#### For FARLAND SAGA I (破晓之誓 / 神奇传说):"
            echo "1. Download \`FarlandSagaPatcher-windows-amd64.exe\` below."
            echo "2. Place it into your Steam game directory (alongside \`FarlandSaga.exe\`)."
            echo "3. Run the executable, choose your language, and click **Install**."
            echo "4. Click **Restore** anytime to return completely to the pristine original game."
            echo
            echo "#### For FARLAND SAGA II (时空道标):"
            echo "1. Download \`FarlandSaga2Patcher-windows-amd64.exe\` below."
            echo "2. Place it into your Steam game directory (alongside \`FarlandSaga2.exe\`)."
            echo "3. Run the executable, choose your language, and click **Install**."
            echo "4. Click **Restore** anytime to return completely to the pristine original game."
            echo
            echo "> [!NOTE]"
            echo "> Please exit the game before installing or restoring."
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat binaries/SHA256SUMS
            echo '```'
          } > release-notes.md
      - name: 创建或更新 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" binaries/* --clobber
          else
            gh release create "$tag" \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "FARLAND SAGA I & II Saturn Tribute Patcher ${tag}" \
              --notes-file release-notes.md \
              binaries/*
          fi

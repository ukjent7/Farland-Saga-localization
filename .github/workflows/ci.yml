name: ci

# 持续集成工作流：在 Pull Request 或直接在 GitHub 提交译稿/代码时自动执行全量校验。
# 涵盖：
# 1. 语料库结构完整性与译文容量边界校验（防止 ISO/Saturn 内存越界或截断）
# 2. ISO9660 数据轨空闲扇区分布与占用校验（test_iso_extents）
# 3. CD-ROM MODE1 EDC/ECC 校验、字模槽位映射、资源绑定与 Unity 结构测试
# 4. Go 单文件补丁器静态检查与单元测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 翻译与核心功能自动化校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: 设置 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: patcher/go.mod
          cache: false

      - name: 翻译容量边界与语料完整性校验
        env:
          FARLAND_WORK: ${{ runner.temp }}/work
          UV_PYTHON_DOWNLOADS: automatic
          UV_PYTHON_PREFERENCE: managed
        run: |
          mkdir -p "$FARLAND_WORK"
          echo "=== 正在校验 2,786 行三语语料容量与格式边界 ==="
          bash flow.sh merge

      - name: ISO 扇区空间与核心自动化测试套件
        env:
          FARLAND_WORK: ${{ runner.temp }}/work
          UV_PYTHON_DOWNLOADS: automatic
          UV_PYTHON_PREFERENCE: managed
        run: |
          echo "=== 正在运行 ISO 扇区占用、CD 校验与 CLI 单元测试 ==="
          bash flow.sh test --cli-only

      - name: 补丁引擎单元测试
        run: |
          echo "=== 正在运行 Go 补丁器单元测试 ==="
          cd patcher
          go vet ./...
          go test -v ./...
